name: Pruebas

on:
  push:
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: sudo apt-get update -q && sudo apt-get install -y -q poppler-utils shellcheck
      - run: python -m unittest discover -s tests -v
      - run: shellcheck instalar.sh desinstalar.sh
      - name: Las reglas de ejemplo se leen bien
        run: |
          mkdir -p ~/.config/ordenito ~/Downloads
          cp reglas.ejemplo.conf ~/.config/ordenito/reglas.conf
          ORDENITO_CARPETA=~/Downloads python ordenito.py simular
