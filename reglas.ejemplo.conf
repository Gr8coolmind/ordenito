# ─────────────────────────────────────────────────────────────────────
#  Reglas de Ordenito  ·  ~/.config/ordenito/reglas.conf
# ─────────────────────────────────────────────────────────────────────
#
#  [carpeta destino]          relativa a tu HOME (o ruta absoluta / ~/...)
#  palabra, otra palabra      palabras clave separadas por coma
#  fuertes: prof. ana perez    (opcional) pistas de IDENTIDAD: profesor, código, empresa
#  extensiones: pdf, docx     (opcional) el bloque solo aplica a esos tipos
#
#  Cómo decide:
#   · Cada palabra en el NOMBRE del archivo vale 10 puntos; en el CONTENIDO,
#     1 punto por aparición (máx. 5). Se leen docx, pptx, xlsx, odt, pdf,
#     txt, md, código y los nombres de lo que hay dentro de un .zip.
#   · Una pista 'fuertes:' vale 25 si aparece en el nombre, el autor, el
#     encabezado o la portada (primeras líneas), y 3 si solo sale de pasada.
#     Así gana quien ES dueño del documento, no el tema que más se repite.
#   · Gana la carpeta con más puntos (mínimo 2).
#   · Si el archivo también encaja en una SUBCARPETA del ganador, va a la
#     subcarpeta (es más específica).
#   · [*/Nombre] es un comodín: crea esa subcarpeta dentro de cualquier tema
#     ganador (ej. [*/Proyecto Final] → Universidad/Redes/Proyecto Final).
#   · Un bloque con SOLO 'extensiones:' es de respaldo por tipo: se usa
#     cuando ningún tema coincidió.
#   · Si nada coincide, el archivo se queda en Descargas.
#
#  Consejos:
#   · Las mejores pistas son únicas: nombre del profesor, código de la
#     materia, nombre de la empresa o del cliente. Ponlas en 'fuertes:'.
#     Escribe el nombre como sale en los documentos (ej. "ana perez" y
#     también "ana maria perez" si a veces usa el nombre completo).
#   · Evita palabras que salen en todo (tu carrera, tu universidad).
#   · Prueba tus cambios con:  ordenito explicar ARCHIVO
#                              ordenito revisar ~/Documents
#   · Mayúsculas, tildes, guiones y guiones bajos dan igual.
# ─────────────────────────────────────────────────────────────────────


# Tu nombre y el de tus compañeros: 'ordenito corregir' nunca los sugerirá
# como pistas (salen en todos tus trabajos, así que no sirven para distinguir).
[no sugerir]
tu nombre completo, tu nombre corto

# IA local (opcional, gratis): lo que ninguna regla reconoce lo decide un modelo que corre
# en tu equipo con Ollama (https://ollama.com); nada sale de tu computadora. Elige una de tus
# carpetas o crea una nueva dentro de Documents, y escribe aquí la regla que aprendió.
# Para activarla: instala Ollama, ejecuta 'ollama pull qwen3:4b' y quita el # de estas líneas.
# [ia]
# modelo: qwen3:4b


# ═══════════════════════ ESTUDIOS (ejemplos) ═══════════════════════

[Documents/Universidad/Redes]
# Cambia esto por tus materias: código y profesor en 'fuertes', temas abajo
fuertes: red-1010, ana perez
subnetting, vlan, enrutamiento, cisco packet tracer, modelo osi

[Documents/Universidad/Ingles]
ingles basico, english, grammar, vocabulary, reading comprehension, listening, workbook

[Documents/Universidad/Administrativo]
seleccion de asignaturas, calendario academico, historial academico, record de notas,
carta de admision, pensum, pago de matricula, horario de clases

[Documents/Cursos]
fuertes: coursera, udemy, platzi, edx, linkedin learning
certificado, certificate, course certificate

# Comodín: aplica dentro de cualquier tema
[*/Proyecto Final]
proyecto final, final project, entrega final, trabajo final, capstone, portafolio


